name: deproof-dev
x-restricted: &restricted
  platform: linux/amd64
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m,mode=1777
  restart: "no"
services:
  android-build:
    platform: linux/amd64
    profiles: [build]
    build:
      context: .
      dockerfile: docker/android-build.Dockerfile
      args:
        BUILDER_UID: ${DEPROOF_BUILD_UID:-10001}
        BUILDER_GID: ${DEPROOF_BUILD_GID:-10001}
    image: deproof/android-build:local
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    mem_limit: 3g
    cpus: 2
    volumes:
      - android_gradle:/cache/gradle
      - android_home:/home/builder
      - ./evidence/docker/android:/export
    tmpfs:
      - /workspace:rw,exec,nosuid,size=1536m,uid=${DEPROOF_BUILD_UID:-10001},gid=${DEPROOF_BUILD_GID:-10001}
      - /tmp:rw,exec,nosuid,size=256m,mode=1777
  node-agent:
    <<: *restricted
    build:
      context: .
      dockerfile: docker/node-agent.Dockerfile
      target: runtime
    image: deproof/node-agent:local
    mem_limit: 384m
    cpus: 0.5
    ports: ["127.0.0.1:${NODE_PORT:-9843}:9843"]
    environment:
      NODE_PAIR_SCOPES: ${NODE_PAIR_SCOPES:-READ_NODE}
      NODE_CONTRIBUTION_ENDPOINT: ${NODE_CONTRIBUTION_ENDPOINT:-}
      NODE_PROOF_JOB: ${NODE_PROOF_JOB:-}
      NODE_PROOF_OWNER: ${NODE_PROOF_OWNER:-}
    volumes:
      - node_state:/state
      - prover_state:/proof-jobs:ro
    healthcheck:
      test: [CMD, python3, -c, "import socket; s=socket.create_connection(('127.0.0.1',9843),3); s.close()"]
      interval: 10s
      timeout: 4s
      retries: 6
  prover-worker:
    <<: *restricted
    build:
      context: .
      dockerfile: docker/prover-worker.Dockerfile
    image: deproof/prover-worker:local
    network_mode: none
    mem_limit: 512m
    cpus: 0.5
    volumes:
      - prover_state:/state
  web:
    <<: *restricted
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: deproof/web:local
    mem_limit: 64m
    cpus: 0.25
    ports: ["127.0.0.1:${WEB_PORT:-8088}:8080"]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 4
  hosting-control:
    profiles: [owner-hosting]
    platform: linux/amd64
    image: deproof/hosting-control:local
    build:
      context: .
      dockerfile: docker/node-agent.Dockerfile
      target: owner-hosting
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    entrypoint: [python3, /opt/deproof/tools/local_hosting.py]
    command: [--help]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - hosting_state:/state
    tmpfs: [/tmp:rw,noexec,nosuid,size=16m,mode=1777]
volumes:
  android_gradle:
    name: ${COMPOSE_PROJECT_NAME:-deproof-dev}_android_gradle_uid_${DEPROOF_BUILD_UID:-10001}
  android_home:
    name: ${COMPOSE_PROJECT_NAME:-deproof-dev}_android_home_uid_${DEPROOF_BUILD_UID:-10001}
  node_state:
  prover_state:
  hosting_state:
