name: Deproof Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Android SDK
        run: |
          # Remove corrupted build-tools if present
          rm -rf ${ANDROID_SDK_ROOT}/build-tools/33.0.1 || true
          # Install required build-tools
          echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platform-tools" "platforms;android-34" 2>&1 || true
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      - run: bash deproof-master-build.sh preflight
      - run: MAX_PARALLEL=2 bash deproof-master-build.sh build
      - uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: .deproof-runs/*/
