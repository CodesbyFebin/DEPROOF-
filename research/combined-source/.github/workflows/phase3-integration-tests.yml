name: Phase 3 - RPC Integration Tests

on: [push, pull_request]

jobs:
  phase3-integration-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        network: [devnet, testnet]
        api-level: [28, 34]

    steps:
      - uses: actions/checkout@v3

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: |
          rm -rf ${ANDROID_SDK_ROOT}/build-tools/33.0.1 || true
          echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager \
            "build-tools;34.0.0" "platform-tools" "platforms;android-28" "platforms;android-34" 2>&1 || true
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Phase 3 instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: |
            export SOLANA_NETWORK=${{ matrix.network }}
            export TARGET_SDK_API=${{ matrix.api-level }}
            ./gradlew connectedAndroidTest \
              -Pnetwork=${{ matrix.network }} \
              -Papi_level=${{ matrix.api-level }} \
              -Pandroid.testInstrumentationRunnerArguments.package=com.deproof.data \
              -x lint

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-results-api${{ matrix.api-level }}-${{ matrix.network }}
          path: app/build/reports/androidTests/

  phase3-completion:
    runs-on: ubuntu-latest
    needs: phase3-integration-tests

    steps:
      - name: Report completion
        run: |
          echo "Phase 3 Integration Tests passed on all matrix combinations."
          echo "Networks tested: devnet, testnet"
          echo "API levels tested: 28, 34"
